<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Squeeze's wallet ($SQUEEZE)</title>
  <meta name="description" content="Squeeze trades his own bag. Every trade, in the open: what he did, at what price, and why." />
  <meta name="theme-color" content="#030604" />
  <meta property="og:title" content="Squeeze's wallet" />
  <meta property="og:description" content="Every trade of Squeeze the octopus, in the open." />
  <meta property="og:image" content="https://squeezeocto.com/assets/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="play/play.css?v=20261011d" />
  <style>
    /* nieuwe stijl: geen vakjes, alles zweeft los over de zee; zachte gloed voor de leesbaarheid */
    .wwrap { position: relative; z-index: 1; width: min(980px, calc(100% - 32px)); margin: .5rem auto 3rem; display: grid; gap: 2.4rem; }
    .wcard { background: none; border: 0; padding: 0; }
    .wcard h2 { margin: 0 0 1rem; font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; color: var(--green); text-align: center; text-shadow: 0 0 18px rgba(124,255,107,.35); }
    .glow { text-shadow: 0 2px 18px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9); }
    .addr { display: flex; flex-wrap: wrap; gap: .4rem .9rem; align-items: center; justify-content: center; }
    .addr code { font-size: 1rem; color: #e9f5ea; overflow-wrap: anywhere; background: none; border: 0; padding: 0; text-shadow: 0 2px 14px rgba(0,0,0,.9); }
    .addr a, .tx a { color: var(--green); font-weight: 700; text-decoration: none; text-shadow: 0 0 14px rgba(124,255,107,.35); }
    /* de cijfers: los verspreid, dobberen zacht als belletjes */
    .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.2rem 1rem; text-align: center; }
    .num { background: none; border: 0; padding: 0; animation: bob 6s ease-in-out infinite; }
    .num:nth-child(2n) { animation-delay: -2s; transform: translateY(18px); }
    .num:nth-child(3n) { animation-delay: -4s; }
    .num:nth-child(4n+1) { margin-left: -1.5rem; }
    .num span { display: block; color: #a9bfb0; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 1px 10px rgba(0,0,0,.9); }
    .num b { display: block; font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 2px 22px rgba(0,0,0,.85), 0 0 26px rgba(124,255,107,.18); margin: .15rem 0; }
    .num b + span { text-transform: none; letter-spacing: 0; font-size: .85rem; color: #cfe9d2; }
    @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -7px; } }
    @media (prefers-reduced-motion: reduce) { .num { animation: none; } }
    .up { color: var(--green) !important; } .down { color: #ff9a8a !important; }
    /* trades: een losse lijst op het water, alleen dunne lijntjes */
    .trades { list-style: none; margin: 0 auto; padding: 0; max-width: 760px; }
    .trade { display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .8rem; align-items: start; padding: 1rem .2rem; border-bottom: 1px solid rgba(124,255,107,.16); background: none; border-radius: 0; }
    .trade:last-child { border-bottom: 0; }
    .ico { font-size: 1.5rem; line-height: 1.2; filter: drop-shadow(0 2px 8px rgba(0,0,0,.8)); }
    .what { font-weight: 800; text-shadow: 0 2px 14px rgba(0,0,0,.9); }
    .why { color: #cfe0d3; font-size: .92rem; grid-column: 2 / 4; text-shadow: 0 1px 10px rgba(0,0,0,.9); }
    .when { color: #a9bfb0; font-size: .8rem; text-align: right; white-space: nowrap; text-shadow: 0 1px 10px rgba(0,0,0,.9); }
    .tx { grid-column: 2 / 4; font-size: .85rem; }
    .empty { color: #cfe0d3; text-align: center; padding: 1.2rem .5rem; text-shadow: 0 1px 12px rgba(0,0,0,.9); }
    .foot { text-align: center; color: #a9bfb0; font-size: .9rem; margin: 0; text-shadow: 0 1px 10px rgba(0,0,0,.9); }
    @media (max-width: 720px) {
      .nums { grid-template-columns: repeat(2, 1fr); gap: 1.8rem .6rem; }
      .num:nth-child(4n+1) { margin-left: 0; }
      .num:nth-child(2n) { transform: translateY(10px); }
    }
    @media (max-width: 520px) { .trade { grid-template-columns: auto 1fr; } .when { grid-column: 2; text-align: left; } }
  </style>
</head>
<body>
  <div class="seabg" aria-hidden="true"></div>

  <header class="top">
    <a class="back" href="./">← Squeeze</a>
    <h1>Squeeze's wallet</h1>
    <p class="sub">He trades his own bag. Every trade, in the open.</p>
  </header>

  <main class="wwrap">
    <section class="wcard">
      <h2>🐙 His wallet</h2>
      <div class="addr" id="addr"><span class="muted">Loading…</span></div>
    </section>

    <section class="wcard">
      <h2>📊 Holdings & results</h2>
      <div class="nums">
        <div class="num"><span>SOL</span><b id="n-sol">–</b></div>
        <div class="num"><span>$PUMP</span><b id="n-pump">–</b><span id="n-pumpusd"></span></div>
        <div class="num"><span>$SQUEEZE</span><b id="n-sq">–</b><span id="n-val"></span></div>
        <div class="num"><span>Total PnL</span><b id="n-pnl">–</b><span id="n-pnlpct"></span></div>
        <div class="num"><span>Profit taken</span><b id="n-real">–</b></div>
        <div class="num"><span>Open result</span><b id="n-open">–</b></div>
        <div class="num"><span>🎁 $PUMP rewards</span><b id="n-rew">–</b><span id="n-rewusd"></span></div>
        <div class="num"><span>🔥 Burned by him</span><b id="n-burn">–</b></div>
      </div>
    </section>

    <section class="wcard">
      <h2>🧾 Trades</h2>
      <ul class="trades" id="trades"><li class="empty">Loading…</li></ul>
    </section>

    <p class="foot"><i>Squeeze trades his own bag. Not advice.</i></p>
  </main>

  <script src="config.js?v=20261011d"></script>
  <script>
  (function () {
    var C = window.SQUEEZE_CONFIG || {};
    var API = (C.WORKER_URL || "https://squeeze-state.inferno2199.workers.dev").replace(/\/$/, "");
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };

    function tok(n) {
      n = Number(n) || 0;
      if (n >= 1e9) return +(n / 1e9).toFixed(2) + "B";
      if (n >= 1e6) return +(n / 1e6).toFixed(2) + "M";
      if (n >= 1e3) return +(n / 1e3).toFixed(1) + "k";
      return n > 0 && n < 10 ? String(+n.toPrecision(3)) : String(Math.round(n));
    }
    function usd(v, signed) {
      if (v == null || !isFinite(v)) return "–";
      var s = signed && v > 0 ? "+" : v < 0 ? "−" : "";
      var a = Math.abs(v);
      return s + "$" + (a >= 1000 ? Math.round(a).toLocaleString("en-US") : a.toFixed(2));
    }
    function price(p) {
      p = Number(p);
      if (!(p > 0)) return "";
      if (p >= 1) return "$" + p.toFixed(2);
      var d = Math.min(12, Math.max(2, 2 - Math.floor(Math.log10(p)) + 1));
      return "$" + p.toFixed(d).replace(/0+$/, "");
    }
    var pct = function (v) { return v == null || !isFinite(v) ? "" : Math.round(v) + "%"; };
    var signClass = function (v) { return v > 0 ? "up" : v < 0 ? "down" : ""; };

    // waarom? in gewone woorden
    function why(t) {
      var w = t.why || {};
      if (w.rule === "dip-1h") return "Price dropped " + pct(w.changePct) + " in 1 hour, so he bought the dip.";
      if (w.rule === "dip-24h") return "Price dropped " + pct(w.changePct) + " in 24 hours, so he bought a little.";
      if (w.rule === "quiet-dip") return "Quiet chart and the price was " + pct(w.changePct) + " in 6 hours, so he added a little.";
      if (w.rule === "take-profit") return "His own tokens were up " + (w.gainPct != null ? "+" + Math.round(w.gainPct) + "%" : "") + ", so he took a little profit.";
      if (w.rule === "ath") return "New all-time high, so he burned part of his own tokens.";
      return "";
    }
    var ICON = { buy: "🐙", sell: "💰", burn: "🔥" };
    function what(t) {
      var p = t.priceUsd ? " at " + price(t.priceUsd) : "";
      if (t.type === "buy") return "Bought " + tok(t.tokens) + " $SQUEEZE for " + usd(t.usd) + p;
      if (t.type === "sell") return "Sold " + tok(t.tokens) + " $SQUEEZE for " + usd(t.usd) + p;
      if (t.type === "burn") return "Burned " + tok(t.tokens) + " $SQUEEZE" + (t.usd ? " (≈ " + usd(t.usd) + ")" : "");
      return "";
    }
    function when(ms) {
      var d = new Date(ms);
      return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " · " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    }

    function render(d) {
      if (d.address) {
        $("addr").innerHTML = "<code>" + esc(d.address) + "</code> <a href=\"https://solscan.io/account/" + encodeURIComponent(d.address) + "\" target=\"_blank\" rel=\"noopener\">View on Solscan ↗</a>";
      } else {
        $("addr").innerHTML = "<span class=\"muted\">His wallet isn't set up yet.</span>";
      }
      $("n-sol").textContent = d.sol != null ? (+Number(d.sol).toFixed(3)).toString() : "–";
      $("n-pump").textContent = d.pump != null ? tok(d.pump) : "–";
      $("n-pumpusd").textContent = d.pumpValueUsd != null ? "≈ " + usd(d.pumpValueUsd) : "";
      $("n-sq").textContent = d.squeeze != null ? tok(d.squeeze) : "–";
      $("n-val").textContent = d.valueUsd != null ? "≈ " + usd(d.valueUsd) : "";
      $("n-pnl").textContent = usd(d.pnlUsd, true);
      $("n-pnl").className = signClass(d.pnlUsd);
      $("n-pnlpct").textContent = d.pnlPct != null && isFinite(d.pnlPct) ? (d.pnlPct > 0 ? "+" : "") + d.pnlPct.toFixed(1) + "%" : "";
      $("n-rew").textContent = tok(d.rewardsPump || 0);
      $("n-rewusd").textContent = d.rewardsUsd ? "≈ " + usd(d.rewardsUsd) : "";
      $("n-real").textContent = usd(d.realizedUsd, true);
      $("n-real").className = signClass(d.realizedUsd);
      $("n-open").textContent = usd(d.unrealizedUsd, true);
      $("n-open").className = signClass(d.unrealizedUsd);
      $("n-burn").textContent = tok(d.burnedTokens || 0);
      var list = d.trades || [];
      if (!list.length) {
        $("trades").innerHTML = "<li class=\"empty\">Squeeze hasn't made his first trade yet. 🐙</li>";
        return;
      }
      $("trades").innerHTML = list.map(function (t) {
        var tx = t.sig ? "<div class=\"tx\"><a href=\"https://solscan.io/tx/" + encodeURIComponent(t.sig) + "\" target=\"_blank\" rel=\"noopener\">Transaction ↗</a></div>" : "";
        return "<li class=\"trade\"><div class=\"ico\">" + (ICON[t.type] || "🐙") + "</div>" +
          "<div class=\"what\">" + esc(what(t)) + "</div><div class=\"when\">" + esc(when(t.t)) + "</div>" +
          "<div class=\"why\">" + esc(why(t)) + "</div>" + tx + "</li>";
      }).join("");
    }

    function load() {
      fetch(API + "/agent", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.error) throw new Error(d.error);
        render(d || {});
      }).catch(function () {
        if (!$("trades").querySelector(".trade")) $("trades").innerHTML = "<li class=\"empty\">Couldn't load his wallet right now. Try again in a minute.</li>";
        if ($("addr").textContent === "Loading…") $("addr").innerHTML = "<span class=\"muted\">–</span>";
      });
    }
    window.__renderWallet = render; // voor een snelle controle met voorbeeldgegevens
    load();
    setInterval(load, 60000);
  })();
  </script>
  <script src="ink.js?v=20261011d" data-page="wallet" defer></script>
  <script src="life.js?v=20261013j" defer></script>
</body>
</html>
