<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Squeeze ($SQUEEZE)</title>
  <meta name="description" content="Buys feed Squeeze. ATHs give him rings. One shared octopus that lives on the $SQUEEZE chart." />
  <meta name="theme-color" content="#030604" />

  <!-- Social preview. Vervang JOUWNAAM door je GitHub-naam (moet een volledige URL zijn). -->
  <meta property="og:title" content="Squeeze ($SQUEEZE)" />
  <meta property="og:description" content="Buys feed Squeeze. ATHs give him rings." />
  <meta property="og:image" content="https://inferno2199.github.io/squeeze/assets/og.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preload" as="image" href="assets/body.png" />
  <link rel="preload" as="image" href="assets/arm.png" />
</head>
<body>
  <header class="top">
    <span class="mark">Squeeze</span>
    <span class="ticker" data-ticker>$SQUEEZE</span>
  </header>

  <main>
    <div class="stage-wrap">
      <canvas id="stage" aria-label="Squeeze the octopus, moving with the $SQUEEZE chart" role="img"></canvas>
      <div id="combo-chip" class="chip combo" aria-hidden="true"></div>
      <div id="ring-chip" class="chip ring" aria-live="polite"></div>
      <div id="poke-chip" class="chip poke" aria-hidden="true"></div>
    </div>

    <dl class="stats">
      <div><dt>24h</dt><dd id="stat-change">–</dd></div>
      <div><dt>Combo</dt><dd id="stat-combo">x0</dd></div>
      <div><dt>Rings</dt><dd id="stat-rings">0</dd></div>
    </dl>

    <section id="timeline" class="timeline" aria-label="Ring history" hidden>
      <ol id="timeline-list"></ol>
      <button id="timeline-more" class="more" type="button" hidden></button>
    </section>

    <p class="line">Buys feed Squeeze. ATHs give him rings.</p>

    <a id="buy" class="buy" href="#" target="_blank" rel="noopener">Buy on Pump.fun</a>

    <div id="ca" class="ca" hidden>
      <span class="ca-label">CA</span>
      <code id="ca-text"></code>
      <button id="ca-copy" type="button">Copy CA</button>
    </div>

    <p id="status" class="status" data-kind="wait"><span class="dot"></span><span id="status-text">Loading Squeeze</span></p>

    <nav id="links" class="links" hidden></nav>

    <section id="dev" class="dev" hidden>
      <label>Chart <input id="dev-price" type="range" min="-1" max="1" step="0.01" value="0" /></label>
      <div class="dev-btns">
        <button type="button" data-act="combo">Combo +1</button>
        <button type="button" data-act="reset">Dump</button>
        <button type="button" data-act="ink">Big buy</button>
        <button type="button" data-act="ath">New ATH</button>
        <button type="button" data-act="reclaim">Reclaim</button>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="squeeze.js"></script>
  <script src="app.js"></script>
</body>
</html>
