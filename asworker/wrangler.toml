name = "squeeze-state"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
MINT = ""          # plak hier je mint (CA)
GRACE_MIN = "5"          # eerste 5 min geen ringen
RECLAIM_DIP = "0.15"     # 15% dip, dan ATH breken = Reclaim
RUN_STEP = "0.3"         # doorlopende pump: ring per +30%
RING_COOLDOWN_S = "30"   # min. 30 sec tussen ringen
INK_USD = "250"
POLL_MS = "10000"
# Jupiter-backup (optioneel): npx wrangler secret put JUP_API_KEY

[[durable_objects.bindings]]
name = "SQUEEZE"
class_name = "SqueezeState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SqueezeState"]

[triggers]
crons = ["* * * * *"]
